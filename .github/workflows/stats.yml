name: Actualizar estadísticas del perfil

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generar estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=GaboNto&theme=dark&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      - name: Generar lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=GaboNto&theme=dark&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar estadísticas" || exit 0
          git push
